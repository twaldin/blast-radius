<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blast Radius — 12 Frontend Directions</title>
<style>
  :root {
    --bg: #0a0a0c; --ink: #e8e6e1; --dim: #8a877f; --red: #ff3b30;
    --line: #26262b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, 'JetBrains Mono', Menlo, monospace;
    padding: 48px 40px 80px;
  }
  header { max-width: 1400px; margin: 0 auto 40px; }
  h1 { font-size: 28px; letter-spacing: -0.5px; font-weight: 600; }
  h1 em { color: var(--red); font-style: normal; }
  .sub { color: var(--dim); margin-top: 8px; font-size: 13px; }
  .grid {
    max-width: 1400px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 24px;
  }
  a.card {
    display: block; border: 1px solid var(--line); text-decoration: none;
    color: inherit; transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: var(--red); transform: translateY(-2px); }
  .thumb { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; background: #111; }
  .meta { padding: 12px 14px; border-top: 1px solid var(--line); }
  .name { font-size: 14px; font-weight: 600; }
  .dir { font-size: 12px; color: var(--dim); margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>BLAST RADIUS — <em>12 directions</em></h1>
  <p class="sub">Your vendors have vendors. Rough-draft landing pages, each browser-reviewed adversarially. Click to open.</p>
</header>
<div class="grid" id="grid"></div>
<script>
const drafts = [
  ["01-war-room",      "War Room",        "Military ops console — phosphor, radar sweep, threat vectors"],
  ["02-swiss-editorial","Swiss Editorial", "International typographic style — grid, grotesk, signal red"],
  ["03-neon-circuit",  "Neon Circuit",    "Cyberpunk PCB — glow traces, glitch, overload surge"],
  ["04-blueprint",     "Blueprint",       "Architectural schematic — plotter strokes, hatch blast zone"],
  ["05-ascii-terminal","ASCII Terminal",  "Pure monospace — box-drawing graph, detonate command"],
  ["06-financial-print","Financial Print","Newspaper front page — engraved chart, red ink marginalia"],
  ["07-aurora-glass",  "Aurora Glass",    "Premium glassmorphism — aurora mesh, shockwave desaturation"],
  ["08-brutalist",     "Brutalist",       "Anti-design — hazard stripes, stamps, acid color"],
  ["09-constellation", "Constellation",   "Deep space — custom physics, supernova blast"],
  ["10-retro-scifi",   "Retro Sci-Fi",    "70s CRT control panel — reactor scram, amber phosphor"],
  ["11-data-maximalist","Data Maximalist","Bloomberg density — counters, sparklines, 2-hop highlight"],
  ["12-contagion",     "Contagion",       "Biological organism — pulsing cells, infection spread"],
];
const grid = document.getElementById('grid');
for (const [slug, name, dir] of drafts) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = `./${slug}/index.html`;
  a.innerHTML = `
    <img class="thumb" src="./${slug}/screenshot.png" alt="${name}" onerror="this.style.display='none'">
    <div class="meta"><div class="name">${name}</div><div class="dir">${dir}</div></div>`;
  grid.appendChild(a);
}
</script>
</body>
</html>
