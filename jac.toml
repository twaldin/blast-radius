[project]
name = "blast-radius"
version = "0.1.0"
description = "Blast Radius supply-chain risk visualizer"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.7"

# The deploy builds its own .jac/venv from this table.
#
[dependencies]
# jac-scale reaches for requests at deploy time and does not vendor it
requests = ">=2.28"
litellm = ">=1.70.0,<=1.82.6"
pillow = ">=12.0.0,<13.0.0"
httpx = ">=0.27.0"
loguru = ">=0.7.2,<0.8.0"

[dev-dependencies]
watchdog = ">=3.0.0"


# OpenRouter credentials are injected as OPENROUTER_API_KEY at runtime.
# The committed seed-backed demo never requires this secret.
[byllm.model]
default_model = "${BYLLM_DEFAULT_MODEL:-openrouter/openai/gpt-4.1-mini}"

[byllm.call_params]
temperature = 0.0
seed = 0


# Pinned, not "latest": the JacHammer builder reported
# `bun install ... No packages! Deleted empty lockfile`, and a lockfile-less
# install of floating ranges is the least reproducible thing we can ship.
# vite + the react plugin sit in the regular table on purpose -- the builder
# runs the client in dev mode, so a production install that skips devDeps
# leaves it with no bundler.
[dependencies.npm]
react = "19.2.8"
react-dom = "19.2.8"
react-router-dom = "7.18.1"
react-error-boundary = "6.1.2"
zod = "4.4.3"
"@tanstack/react-form" = "1.33.2"
"react-hook-form" = "7.83.0"
"@hookform/resolvers" = "5.5.7"
vite = "8.1.5"
"@vitejs/plugin-react" = "6.0.4"

[scale.server]
docs_enabled = true
suppress_health_check_logs = true

[scale.kubernetes]
app_name = "blast-radius"
namespace = "blast-radius"
min_replicas = 1
max_replicas = 4
cpu_request = "250m"
cpu_utilization_target = 70
memory_limit = "1Gi"
health_check_path = "/healthz"
