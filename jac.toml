[project]
name = "blast-radius"
version = "0.1.0"
description = "Blast Radius supply-chain risk visualizer"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.7"

[dependencies]

[dev-dependencies]
watchdog = ">=3.0.0"


[serve]
base_route_app = "app"

[dependencies.npm.dev]
vite = "latest"
"@vitejs/plugin-react" = "latest"

[dependencies.npm]
react = "latest"
react-dom = "latest"
react-router-dom = "latest"
react-error-boundary = "latest"
zod = "latest"
"@tanstack/react-form" = "latest"
react-force-graph-2d = "latest"

[scale.server]
docs_enabled = true
suppress_health_check_logs = true

[scale.kubernetes]
app_name = "blast-radius"
namespace = "blast-radius"
min_replicas = 1
max_replicas = 4
cpu_request = "250m"
cpu_utilization_target = 70
memory_limit = "1Gi"
health_check_path = "/healthz"
