[project]
name = "blast-radius"
version = "0.1.0"
description = "Blast Radius supply-chain risk visualizer"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.7"

[dependencies]
litellm = ">=1.70.0,<=1.82.6"
pillow = ">=12.0.0,<13.0.0"
httpx = ">=0.27.0"
loguru = ">=0.7.2,<0.8.0"

[dev-dependencies]
watchdog = ">=3.0.0"


# OpenRouter credentials are injected as OPENROUTER_API_KEY at runtime.
# The committed seed-backed demo never requires this secret.
[byllm.model]
default_model = "${BYLLM_DEFAULT_MODEL:-openrouter/openai/gpt-4.1-mini}"

[byllm.call_params]
temperature = 0.0
seed = 0

[serve]
base_route_app = "app"

[dependencies.npm.dev]
vite = "latest"
"@vitejs/plugin-react" = "latest"

[dependencies.npm]
react = "latest"
react-dom = "latest"
react-router-dom = "latest"
react-error-boundary = "latest"
zod = "latest"
"@tanstack/react-form" = "latest"
react-force-graph-2d = "latest"

[scale.server]
docs_enabled = true
suppress_health_check_logs = true

[scale.kubernetes]
app_name = "blast-radius"
namespace = "blast-radius"
min_replicas = 1
max_replicas = 4
cpu_request = "250m"
cpu_utilization_target = 70
memory_limit = "1Gi"
health_check_path = "/healthz"
